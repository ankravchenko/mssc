[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mssc"
version = "0.1.0"
description = "Multi-scale structural complexity for images and multidimensional data"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "opencv-python>=4.10",
    "Pillow>=10.4",
    "imageio>=2.35",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.9",
]
data = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]
dev = [
    "build>=1.2",
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
